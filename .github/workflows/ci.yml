name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate.mjs
      - run: node tests/i18n.mjs
      - name: Formato e lint del JavaScript
        run: |
          npm i --no-save prettier@3.8.1 eslint@10
          npx prettier --check "wwwroot/js/**/*.js" "tests/**/*.mjs" "web/*.js" "web/*.mjs" eslint.config.mjs
          npx eslint wwwroot/js tests web eslint.config.mjs
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
      - run: node tests/web.mjs
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/server.mjs
