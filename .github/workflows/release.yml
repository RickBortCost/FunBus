name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da creare (es. v1.0.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish -c Release -r win-x64 -o publish
      - name: Crea release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag || github.ref_name }}" --target "${{ github.sha }}" publish/IndustrialProtocolsLab.exe --title "${{ inputs.tag || github.ref_name }}" --generate-notes
