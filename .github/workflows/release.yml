name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da creare (es. v1.0.0)'
        required: true
      notes:
        description: 'Descrizione della versione (markdown)'
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compila e crea release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          dotnet publish -c Release -r win-x64 -o publish -p:Version="${tag#v}"
          gh release create "$tag" --target "${{ github.sha }}" publish/FunBus.exe --title "FunBus $tag" --notes "${NOTES:-Nuova versione di FunBus.}"
