name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da creare (es. v1.0.0)'
        required: true
      notes:
        description: 'Descrizione della versione (markdown)'
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compila e pubblica/aggiorna la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          { cat .github/RELEASE_INTRO.md; echo "## Novità di $tag"; echo; echo "${NOTES:-Nuova versione di FunBus.}"; } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
          else
            dotnet publish -c Release -r win-x64 -o publish -p:Version="${tag#v}"
            gh release create "$tag" --target "${{ github.sha }}" publish/FunBus.exe --title "FunBus $tag" --notes-file notes.md
          fi
